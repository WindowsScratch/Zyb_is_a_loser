<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全验证</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8ecf7;
    background:
      radial-gradient(circle at 15% 15%, #22304f 0%, transparent 55%),
      radial-gradient(circle at 85% 85%, #2b1a4a 0%, transparent 55%),
      #0b1020;
  }

  .card {
    width: 100%;
    max-width: 480px;
    padding: 24px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    transition: max-width 0.6s cubic-bezier(.4, 0, .2, 1);
  }
  .card.expanded { max-width: 760px; }

  .card.shake { animation: shake 0.5s cubic-bezier(.36, .07, .19, .97); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-11px) rotate(-.4deg); }
    35% { transform: translateX(9px) rotate(.4deg); }
    55% { transform: translateX(-6px); }
    75% { transform: translateX(4px); }
  }

  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .head .icon {
    width: 26px; height: 26px; flex: none;
    border-radius: 8px;
    background: linear-gradient(140deg, #5c8bff, #a259ff);
    display: grid; place-items: center;
    font-size: 14px; font-weight: 700;
  }
  .head h1 { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  .sub { font-size: 13px; color: #93a0bd; margin-bottom: 18px; }

  .puzzle {
    position: relative;
    height: 170px;
    margin-bottom: 18px;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(135deg, #3b5bdb 0%, #7048e8 45%, #e64980 100%);
  }
  .puzzle::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 72% 26%, rgba(255,255,255,.30), transparent 42%),
      radial-gradient(circle at 22% 78%, rgba(255,255,255,.20), transparent 48%),
      radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,.18) 100%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.055) 0 12px, transparent 12px 24px);
  }
  .puzzle .tag {
    position: absolute; left: 14px; bottom: 12px;
    font-size: 12px; color: rgba(255,255,255,.85);
    letter-spacing: .5px;
  }

  .track {
    position: relative;
    height: 52px;
    border-radius: 26px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transition: opacity .3s;
  }
  .track.disabled { opacity: .5; }

  .fill {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 0;
    background: linear-gradient(90deg, rgba(92,139,255,.45), rgba(162,89,255,.70));
    pointer-events: none;
  }

  .track-text {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 13px; letter-spacing: .5px;
    color: #aab6d4;
    pointer-events: none;
    transition: opacity .15s linear;
  }

  .thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 46px; height: 46px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 17px; font-weight: 700;
    color: #3b5bdb;
    background: linear-gradient(150deg, #ffffff, #ccd8ff);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .38);
    cursor: grab;
    touch-action: none;
    transition: box-shadow .2s, transform .15s;
  }
  .thumb.active { cursor: grabbing; transform: scale(1.04); box-shadow: 0 6px 20px rgba(92,139,255,.55); }
  .track.disabled .thumb { cursor: default; }

  .status {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    color: #9fb0d4;
    opacity: 0;
    height: 0;
    overflow: hidden;
    transition: opacity .3s, height .3s;
  }
  .status.show { opacity: 1; height: 20px; }
  .status.error { color: #ff7a8a; font-weight: 600; }

  .reveal {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    margin-top: 0;
    transition:
      grid-template-rows .65s cubic-bezier(.4, 0, .2, 1),
      opacity .45s ease .1s,
      margin-top .65s cubic-bezier(.4, 0, .2, 1);
  }
  .reveal.open {
    grid-template-rows: 1fr;
    opacity: 1;
    margin-top: 18px;
  }
  .reveal-inner { overflow: hidden; min-height: 0; }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .5);
  }
  .frame iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }

  .retry {
    display: none;
    margin: 16px auto 0;
    padding: 9px 22px;
    font-size: 13px;
    font-family: inherit;
    color: #cfd8ee;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .retry:hover { background: rgba(255, 255, 255, .15); }
  .retry:active { transform: scale(.97); }
  .retry.show { display: block; }
</style>
</head>
<body>

<div class="card" id="card">

  <div class="head">
    <div class="icon">✓</div>
    <h1>安全验证</h1>
  </div>
  <p class="sub">请拖动滑块完成拼图，以证明您不是机器人</p>

  <div class="puzzle" id="puzzle">
    <span class="tag">拖动下方滑块完成验证</span>
  </div>

  <div class="track" id="track">
    <div class="fill" id="fill"></div>
    <span class="track-text" id="trackText">按住滑块，拖动到最右侧</span>
    <div class="thumb" id="thumb">→</div>
  </div>

  <div class="status" id="status"></div>

  <div class="reveal" id="reveal">
    <div class="reveal-inner">
      <div class="frame">
        <iframe
          id="biliFrame"
          src="about:blank"
          scrolling="no"
          border="0"
          frameborder="no"
          framespacing="0"
          allow="autoplay; fullscreen"
          allowfullscreen="true">
        </iframe>
      </div>
    </div>
  </div>

  <button class="retry" id="retry">重新验证</button>
</div>

<script>
(function () {
  'use strict';

  const card      = document.getElementById('card');
  const track     = document.getElementById('track');
  const thumb     = document.getElementById('thumb');
  const fill      = document.getElementById('fill');
  const trackText = document.getElementById('trackText');
  const statusEl  = document.getElementById('status');
  const reveal    = document.getElementById('reveal');
  const retryBtn  = document.getElementById('retry');
  const biliFrame = document.getElementById('biliFrame');

  // 关键修改：增加 &t=0（跳转到00:00）和 &danmaku=0（关闭弹幕）
  const VIDEO_URL =
    'https://player.bilibili.com/player.html' +
    '?isOutside=true&aid=80433022&bvid=BV1GJ411x7h7' +
    '&cid=137649199&p=1&autoplay=1&t=0&danmaku=0';

  const OFFSET = 3;
  const PAD    = 6;

  let maxX = 0;
  let curX = 0;
  let startX = 0;
  let dragging = false;
  let state = 'idle';

  function measure() {
    maxX = Math.max(0, track.clientWidth - thumb.offsetWidth - PAD);
  }

  function render() {
    thumb.style.left = (OFFSET + curX) + 'px';
    fill.style.width = (OFFSET + curX + thumb.offsetWidth) + 'px';
    const p = maxX > 0 ? curX / maxX : 0;
    trackText.style.opacity = String(Math.max(0, 1 - p * 1.8));
  }

  measure();
  render();

  window.addEventListener('resize', function () {
    measure();
    if (curX > maxX) curX = maxX;
    render();
  });

  thumb.addEventListener('pointerdown', function (e) {
    if (state !== 'idle') return;
    dragging = true;
    thumb.setPointerCapture(e.pointerId);
    startX = e.clientX - curX;
    thumb.classList.add('active');
  });

  thumb.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    curX = Math.min(Math.max(0, e.clientX - startX), maxX);
    render();
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    thumb.classList.remove('active');

    if (curX >= maxX - 2) {
      curX = maxX;
      render();
      startVerify();
    } else {
      curX = 0;
      render();
    }
  }

  thumb.addEventListener('pointerup', endDrag);
  thumb.addEventListener('pointercancel', endDrag);

  function startVerify() {
    state = 'verifying';
    track.classList.add('disabled');
    statusEl.className = 'status show';
    statusEl.textContent = '正在验证…';
    setTimeout(fail, 1300);
  }

  function fail() {
    state = 'failed';
    statusEl.className = 'status show error';
    statusEl.textContent = '验证失败：检测到异常行为，请完成下方验证';

    card.classList.add('shake');
    setTimeout(function () { card.classList.remove('shake'); }, 520);

    card.classList.add('expanded');
    reveal.classList.add('open');
    retryBtn.classList.add('show');

    biliFrame.src = VIDEO_URL;

    setTimeout(function () {
      reveal.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 450);
  }

  retryBtn.addEventListener('click', function () {
    state = 'idle';
    curX = 0;

    reveal.classList.remove('open');
    card.classList.remove('expanded');
    retryBtn.classList.remove('show');
    track.classList.remove('disabled');
    statusEl.className = 'status';
    statusEl.textContent = '';

    biliFrame.src = 'about:blank';

    measure();
    render();
  });

})();
</script>
</body>
</html>
